<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Thirsty Bear Force Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#2E4053;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:pointer;position:relative;z-index:1}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .4s}
#startScreen{background:linear-gradient(135deg,#1a1a2e 0,#16213e 50%,#0f3460 100%)}
#startScreen h1{font-size:clamp(2rem,8vw,5rem);color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,.5),0 4px 8px rgba(0,0,0,.5);text-align:center;margin-bottom:.3em}
#startScreen .subtitle{font-size:clamp(1rem,3vw,1.8rem);color:#ffa07a;margin-bottom:.8em;text-align:center;font-style:italic;opacity:.9}
#startScreen .bear-icon{font-size:clamp(4rem,15vw,8rem);margin-bottom:.3em;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.btn{font-size:clamp(1.2rem,4vw,2.2rem);padding:.5em 2em;border:none;border-radius:50px;cursor:pointer;font-weight:700;transition:all .2s;text-transform:uppercase;letter-spacing:2px}
.btn-play{background:linear-gradient(135deg,#FFD700,#FFA500);color:#1a1a2e;box-shadow:0 0 30px rgba(255,215,0,.4)}
.btn-play:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,215,0,.6)}
.btn-play:active{transform:scale(.95)}
.btn-restart{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;box-shadow:0 0 30px rgba(255,107,107,.4);margin-top:1em}
.btn-restart:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,107,107,.6)}
.btn-restart:active{transform:scale(.95)}
#gameOverScreen{background:rgba(0,0,0,.85);display:none;opacity:0}
#gameOverScreen.show{display:flex;opacity:1}
#gameOverScreen h1{font-size:clamp(2rem,7vw,4.5rem);color:#ff4444;text-shadow:0 0 40px rgba(255,0,0,.6),0 4px 8px rgba(0,0,0,.5);text-align:center}
#gameOverScreen .sub{font-size:clamp(1rem,3vw,1.8rem);color:#ffa07a;margin:.3em 0 0;text-align:center}
.go-stats{font-size:clamp(1.1rem,3vw,1.8rem);color:#FFF;margin:.5em 0;text-align:center;letter-spacing:2px}
.stats{color:#fff;font-size:clamp(1rem,2.5vw,1.5rem);margin:1em 0;text-align:center}
.hidden{display:none!important}
.highscore{font-size:clamp(.8rem,2.5vw,1.3rem);color:#FFD700;margin-bottom:.5em;text-align:center;opacity:.8;letter-spacing:1px}
</style>
</head>
<body>
<div id="startScreen" class="overlay">
<div class="bear-icon">🐻</div>
<h1>Thirsty Bear<br>Force-Feed!</h1>
<p class="subtitle">"He said stop... but did you listen?"</p>
<div class="highscore" id="highScoreDisplay"></div>
<button class="btn btn-play" id="playBtn">PLAY</button>
</div>
<div id="gameOverScreen" class="overlay">
<h1>BEAR GOES BOOM!</h1>
<p class="sub">The bear couldn't handle your kindness...</p>
<div class="go-stats" id="goStats"></div>
<button class="btn btn-restart" id="restartBtn">PLAY AGAIN</button>
</div>
<canvas id="gameCanvas"></canvas>
<script>
// =====================================================================
// THIRSTY BEAR FORCE-FEED — A Canvas PWA Game
// =====================================================================

// ===================== PWA SETUP =====================================
(function setupPWA() {
  // Generate icon canvases
  function genIcon(size) {
    const c = document.createElement('canvas');
    c.width=size;c.height=size;
    const x=c.getContext('2d');
    const cx=size/2,cy=size/2,r=size*0.38;
    // Brown circle head
    x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);
    x.fillStyle='#8B5E3C';x.fill();
    // Ears
    x.beginPath();x.arc(cx-r*0.7,cy-r*0.7,r*0.3,0,Math.PI*2);
    x.fillStyle='#6B3F1F';x.fill();
    x.beginPath();x.arc(cx+r*0.7,cy-r*0.7,r*0.3,0,Math.PI*2);
    x.fillStyle='#6B3F1F';x.fill();
    // Snout
    x.beginPath();x.arc(cx,cy+r*0.15,r*0.35,0,Math.PI*2);
    x.fillStyle='#D4A574';x.fill();
    // Nose
    x.beginPath();x.arc(cx,cy+r*0.1,r*0.1,0,Math.PI*2);
    x.fillStyle='#2C1810';x.fill();
    // Eyes
    x.beginPath();x.arc(cx-r*0.25,cy-r*0.2,r*0.06,0,Math.PI*2);
    x.fillStyle='#2C1810';x.fill();
    x.beginPath();x.arc(cx+r*0.25,cy-r*0.2,r*0.06,0,Math.PI*2);
    x.fillStyle='#2C1810';x.fill();
    return c.toDataURL('image/png');
  }
  const icon192=genIcon(192),icon512=genIcon(512);
  // Blob manifest
  const manifest={
    name:'Thirsty Bear Force Feed',
    short_name:'Bear Feed',
    description:'Force-feed the thirsty bear until he pops!',
    start_url:'.',
    display:'standalone',
    orientation:'portrait',
    theme_color:'#FF7F50',
    background_color:'#2E4053',
    icons:[
      {src:icon192,sizes:'192x192',type:'image/png'},
      {src:icon512,sizes:'512x512',type:'image/png'}
    ]
  };
  const manifestBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const manifestUrl=URL.createObjectURL(manifestBlob);
  const link=document.createElement('link');
  link.rel='manifest';link.href=manifestUrl;
  document.head.appendChild(link);
  // Service worker
  if('serviceWorker' in navigator){
    const pageUrl=window.location.href;
    const swCode=`
      const PAGE=${JSON.stringify(pageUrl)};
      const CACHE='bear-feed-v1';
      self.addEventListener('install',e=>{
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE).then(c=>c.addAll([PAGE])));
      });
      self.addEventListener('fetch',e=>{
        e.respondWith(
          caches.match(e.request).then(r=>r||fetch(e.request))
        );
      });
    `;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl,{scope:'./'}).catch(()=>{});
  }
})();

// ===================== CANVAS SETUP ==================================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}

// ===================== AUDIO ENGINE ==================================
let audioCtx=null;
let muted=false;
function getAudioCtx(){
  if(muted) return null;
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

const Sound={
  walk(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(80,ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+0.1);
      gain.gain.setValueAtTime(0.15,ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.12);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(ac.currentTime+0.12);
    }catch(e){}
  },
  slurp(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      const filter=ac.createBiquadFilter();
      filter.type='lowpass';
      filter.frequency.setValueAtTime(800,ac.currentTime);
      filter.frequency.exponentialRampToValueAtTime(200,ac.currentTime+0.3);
      osc.type='sawtooth';
      osc.frequency.setValueAtTime(600,ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300,ac.currentTime+0.25);
      gain.gain.setValueAtTime(0.2,ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
      osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(ac.currentTime+0.3);
    }catch(e){}
  },
  warning(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='sawtooth';
      const t=ac.currentTime;
      osc.frequency.setValueAtTime(150,t);
      osc.frequency.linearRampToValueAtTime(300,t+0.08);
      osc.frequency.linearRampToValueAtTime(100,t+0.16);
      osc.frequency.linearRampToValueAtTime(400,t+0.24);
      osc.frequency.linearRampToValueAtTime(100,t+0.32);
      gain.gain.setValueAtTime(0.3,t);
      gain.gain.setValueAtTime(0.3,t+0.25);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      const dist=ac.createWaveShaper();
      const k=12,cs=new Float32Array(256);
      for(let i=0;i<256;i++){const x=(i-128)/128;cs[i]=((Math.PI+k)*x-Math.PI*x**3)/(2*Math.PI);}
      dist.curve=cs;
      osc.connect(dist);dist.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(t+0.4);
    }catch(e){}
  },
  dogLaugh(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='square';
      const t=ac.currentTime;
      for(let i=0;i<6;i++){
        const note=t+i*0.12;
        osc.frequency.setValueAtTime(i%2===0?500:600,note);
      }
      gain.gain.setValueAtTime(0.08,t);
      gain.gain.setValueAtTime(0.08,t+0.6);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.72);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(t+0.72);
    }catch(e){}
  },
  burst(){
    try{
      const ac=getAudioCtx();
      // White noise burst
      const bufferSize=ac.sampleRate*0.6;
      const buffer=ac.createBuffer(1,bufferSize,ac.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.08));
      const noise=ac.createBufferSource();
      noise.buffer=buffer;
      const noiseGain=ac.createGain();
      noiseGain.gain.setValueAtTime(0.5,ac.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
      noise.connect(noiseGain);noiseGain.connect(ac.destination);
      noise.start();noise.stop(ac.currentTime+0.6);
      // Descending splat
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(400,ac.currentTime+0.1);
      osc.frequency.exponentialRampToValueAtTime(50,ac.currentTime+0.6);
      gain.gain.setValueAtTime(0.3,ac.currentTime+0.1);
      gain.gain.linearRampToValueAtTime(0.2,ac.currentTime+0.3);
      gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.7);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start(ac.currentTime+0.1);osc.stop(ac.currentTime+0.7);
    }catch(e){}
  },
  pop(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(1200,ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300,ac.currentTime+0.12);
      gain.gain.setValueAtTime(0.2,ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(ac.currentTime+0.12);
    }catch(e){}
  },
  bark(){
    try{
      const ac=getAudioCtx();
      for(let i=0;i<3;i++){
        const osc=ac.createOscillator();
        const gain=ac.createGain();
        const t=ac.currentTime+i*0.1;
        osc.type='square';
        osc.frequency.setValueAtTime(500-i*50,t);
        osc.frequency.exponentialRampToValueAtTime(800-i*100,t+0.06);
        gain.gain.setValueAtTime(0.12-i*0.03,t);
        gain.gain.exponentialRampToValueAtTime(0.001,t+0.08);
        osc.connect(gain);gain.connect(ac.destination);
        osc.start(t);osc.stop(t+0.08);
      }
    }catch(e){}
  },
  giggle(){
    try{
      const ac=getAudioCtx();
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.type='sine';
      const t=ac.currentTime;
      for(let i=0;i<4;i++){
        osc.frequency.setValueAtTime(800+i*100,t+i*0.06);
      }
      gain.gain.setValueAtTime(0.12,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start();osc.stop(t+0.3);
    }catch(e){}
  }
};

// ===================== GAME STATE ====================================
const State={
  START:'start',
  WALKING:'walking',
  THIRSTY:'thirsty',
  DRINKING:'drinking',
  WARNING:'warning',
  BURST:'burst',
  GAME_OVER:'game_over'
};

let game={
  state:State.START,
  drinkCount:0,
  fillLevel:0,
  maxSafeDrinks:15,
  baseRadius:35,
  bearX:-200,
  bearY:0,
  targetX:0,
  walkProgress:0,
  isWalking:true,
  tongueOut:false,
  sweatDrops:[],
  bellyScale:1,
  targetBellyScale:1,
  headTilt:0,
  bottleAngle:0,
  bottleSquash:1,
  screenShake:{x:0,y:0,intensity:0},
  shakeTime:0,
  warningBubbleAlpha:0,
  burstTimer:0,
  burstParticles:[],
  plusOnes:[],
  streamProgress:0,
  isStreaming:false,
  streamTimer:0,
  dogRollPhase:0,
  dogBubbleText:'LOL',
  dogBubbleTimer:0,
  dogLaughTimer:0,
  dogScale:1,
  dogTargetScale:1,
  walkTimer:0,
  introBubble:'',
  introBubbleAlpha:0,
  introStage:0, // 0=walking,1=thirsty text,2=show prompt
  showPrompt:false,
  promptAlpha:0,
  canDrink:false,
  gameTime:0,
  bearDead:false,
  bearBodyAngle:0,
  bearRagdollY:0,
  shakeAmount:0,
  stopBubble:{
    show:false,
    scale:0,
    shakeX:0,
    shakeY:0
  },
  bottleShake:0,
  burpTimer:0,
  drinkAnimTimer:0,
  boomText:{show:false,scale:0,alpha:1},
  dogShake:0
};

// ===================== COORDINATE HELPERS ============================
function groundY(){return H*0.82}
function bearCenterX(){return W*0.62}
function bearCenterY(){
  // Feet bottom = bearY + baseRadius * 1.12, want on ground
  return groundY() - game.baseRadius * 1.12;
}
function dogCenterX(){return W*0.15}
function dogCenterY(){
  // Sitting puppy's bottom is at ground level
  return groundY();
}
function bottleCenterX(){return W*0.85}
function bottleCenterY(){
  // Sitting on the sidewalk, just above the road
  const bh=Math.min(W,H)*0.12;
  return groundY() - bh * 0.35;
}

// ===================== DRAWING FUNCTIONS =============================

// ----- Background -----
function drawBackground(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,groundY());
  sky.addColorStop(0,'#4FC3F7');
  sky.addColorStop(0.5,'#81D4FA');
  sky.addColorStop(1,'#B3E5FC');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,groundY());
  // Sun (animated, bigger, giggle-able)
  const sunWobble=game.sunWobble>0?Math.sin(game.gameTime*0.2)*game.sunWobble*0.5:0;
  const sunX=W*0.85+sunWobble,sunY=H*0.1+Math.cos(game.gameTime*0.25)*sunWobble*0.3;
  const sunR=Math.min(W,H)*0.09;
  const sunPulse=1+Math.sin(game.gameTime*0.015)*0.06;
  const sR=sunR*sunPulse;
  // Glow
  const sunGrad=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sR*2.5);
  sunGrad.addColorStop(0,'rgba(255,255,0,0.35)');
  sunGrad.addColorStop(0.4,'rgba(255,200,0,0.12)');
  sunGrad.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=sunGrad;ctx.beginPath();ctx.arc(sunX,sunY,sR*2.5,0,Math.PI*2);ctx.fill();
  // Rotating rays
  const rayAngle=game.gameTime*0.008;
  ctx.strokeStyle='rgba(255,200,50,0.25)';ctx.lineWidth=2.5;
  for(let i=0;i<12;i++){
    const a=rayAngle+i*Math.PI/6;
    ctx.beginPath();ctx.moveTo(sunX+Math.cos(a)*sR*1.1,sunY+Math.sin(a)*sR*1.1);
    ctx.lineTo(sunX+Math.cos(a)*sR*1.6,sunY+Math.sin(a)*sR*1.6);
    ctx.stroke();
  }
  // Sun body
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(sunX,sunY,sR,0,Math.PI*2);ctx.fill();
  // Sun face (subtle animation)
  const blink=Math.sin(game.gameTime*0.04)>0.95?0.02:sR*0.08;
  const smileSize=0.25+Math.sin(game.gameTime*0.02)*0.06;
  ctx.fillStyle='#FFA000';
  ctx.beginPath();ctx.arc(sunX-sR*0.25,sunY-sR*0.15,blink,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sunX+sR*0.25,sunY-sR*0.15,blink,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFA000';ctx.lineWidth=sR*0.07;
  ctx.beginPath();ctx.arc(sunX,sunY+sR*0.1,sR*smileSize,0.15,Math.PI-0.15);ctx.stroke();
  // Giggle text when tapped
  if(game.sunWobble>0){
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1.5;
    ctx.font=`bold ${sR*0.35}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeText('hehe!',sunX,sunY-sR*1.4);
    ctx.fillText('hehe!',sunX,sunY-sR*1.4);
  }
  // Grass
  ctx.fillStyle='#66BB6A';
  ctx.fillRect(0,groundY()-H*0.02,W,H*0.02);
  // Road
  ctx.fillStyle='#616161';
  ctx.fillRect(0,groundY(),W,H*0.08);
  // Road dashed line
  ctx.strokeStyle='#FFF';
  ctx.lineWidth=H*0.006;
  ctx.setLineDash([H*0.03,H*0.02]);
  ctx.beginPath();ctx.moveTo(0,groundY()+H*0.04);ctx.lineTo(W,groundY()+H*0.04);ctx.stroke();
  ctx.setLineDash([]);
  // Sidewalk
  ctx.fillStyle='#9E9E9E';
  ctx.fillRect(0,groundY()-H*0.02,W,H*0.02);
  // Sidewalk lines
  ctx.strokeStyle='#BDBDBD';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){
    ctx.beginPath();ctx.moveTo(x,groundY()-H*0.02);ctx.lineTo(x,groundY());ctx.stroke();
  }
}

function drawCloud(x,y,r){
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.8,y-r*0.1,r*0.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*1.5,y,r*0.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.7,y+r*0.3,r*0.6,0,Math.PI*2);ctx.fill();
}

// ----- Bottle -----
function drawBottle(){
  const bx=bottleCenterX(),by=bottleCenterY();
  const bw=Math.min(W,H)*0.055,bh=Math.min(W,H)*0.12;
  // Pulsing glow (brighter when feeding)
  const glowPulse=0.5+0.5*Math.sin(game.gameTime*0.003);
  const glowBase=game.feeding?0.5:0.2;
  const glowAmp=game.feeding?0.3:0.15;
  const glowGrad=ctx.createRadialGradient(bx,by,0,bx,by,bh*1.5);
  glowGrad.addColorStop(0,`rgba(255,200,50,${glowBase+glowAmp*glowPulse})`);
  glowGrad.addColorStop(0.5,`rgba(255,200,50,${(glowBase+glowAmp*glowPulse)*0.3})`);
  glowGrad.addColorStop(1,'rgba(255,200,50,0)');
  ctx.fillStyle=glowGrad;ctx.beginPath();ctx.arc(bx,by,bh*1.5,0,Math.PI*2);ctx.fill();
  // Bottle — pivot from bottom (where finger holds)
  ctx.save();
  ctx.translate(bx,by+bh*0.4);
  if(game.bottleShake>0){
    ctx.translate((Math.random()-0.5)*game.bottleShake,(Math.random()-0.5)*game.bottleShake);
  }
  ctx.rotate(game.bottleAngle);
  ctx.translate(0,-bh*0.4);
  ctx.scale(1,game.bottleSquash);
  // Water level indicator (inside bottle)
  const fillH=bh*0.45*game.fillLevel;
  if(game.fillLevel>0){
    ctx.fillStyle='rgba(100,180,255,0.35)';
    roundRect(ctx,-bw*0.42,-bh*0.1-fillH,bw*0.84,fillH,3);ctx.fill();
  }
  // Bottle cap
  ctx.fillStyle='#1565C0';ctx.strokeStyle='#0D47A1';ctx.lineWidth=2;
  roundRect(ctx,-bw*0.32,-bh*0.88,bw*0.64,bh*0.1,4);ctx.fill();ctx.stroke();
  // Bottle neck
  ctx.fillStyle='#42A5F5';ctx.strokeStyle='#1E88E5';ctx.lineWidth=1.5;
  roundRect(ctx,-bw*0.22,-bh*0.75,bw*0.44,bh*0.14,3);ctx.fill();ctx.stroke();
  // Bottle shoulder
  ctx.fillStyle='#64B5F6';
  ctx.beginPath();ctx.moveTo(-bw*0.22,-bh*0.6);ctx.lineTo(-bw*0.45,-bh*0.4);ctx.lineTo(bw*0.45,-bh*0.4);ctx.lineTo(bw*0.22,-bh*0.6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#1E88E5';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-bw*0.22,-bh*0.6);ctx.lineTo(-bw*0.45,-bh*0.4);ctx.lineTo(bw*0.45,-bh*0.4);ctx.lineTo(bw*0.22,-bh*0.6);ctx.closePath();ctx.stroke();
  // Bottle body (wider, rounded bottom)
  ctx.fillStyle='#64B5F6';ctx.strokeStyle='#1E88E5';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-bw*0.45,-bh*0.4);
  ctx.lineTo(-bw*0.45,bh*0.15);
  ctx.quadraticCurveTo(-bw*0.45,bh*0.35,-bw*0.25,bh*0.35);
  ctx.lineTo(bw*0.25,bh*0.35);
  ctx.quadraticCurveTo(bw*0.45,bh*0.35,bw*0.45,bh*0.15);
  ctx.lineTo(bw*0.45,-bh*0.4);
  ctx.closePath();ctx.fill();ctx.stroke();
  // Label
  ctx.fillStyle='rgba(255,255,255,0.9)';
  roundRect(ctx,-bw*0.34,-bh*0.1,bw*0.68,bh*0.25,4);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.5;
  roundRect(ctx,-bw*0.34,-bh*0.1,bw*0.68,bh*0.25,4);ctx.stroke();
  ctx.fillStyle='#1565C0';ctx.font=`bold ${bw*0.25}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('💧',0,-bh*0.02);
  ctx.fillStyle='#0D47A1';ctx.font=`bold ${bw*0.18}px sans-serif`;
  ctx.fillText('WATER',0,bh*0.08);
  // Highlight on body
  ctx.fillStyle='rgba(255,255,255,0.25)';
  roundRect(ctx,-bw*0.32,-bh*0.35,bw*0.1,bh*0.35,3);ctx.fill();
  ctx.restore();
}

// ----- Bear -----
function drawBear(){
  const alpha = game.state===State.GAME_OVER ? Math.max(0, 1 - game.burstTimer/60) : 1;
  ctx.save();
  ctx.globalAlpha = game.state===State.GAME_OVER ? alpha : 1;

  const bx=game.bearX;
  const by=game.bearY;

  ctx.translate(bx,by);

  // Warning red tint
  if(game.state===State.WARNING){
    ctx.save();
    ctx.globalAlpha=0.15+0.1*Math.sin(game.gameTime*0.01);
    ctx.fillStyle='#FF0000';
    ctx.beginPath();ctx.arc(0,0,game.baseRadius+game.fillLevel*400+20,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Burst ragdoll
  if(game.state===State.BURST||game.state===State.GAME_OVER){
    ctx.rotate(game.bearBodyAngle);
  }

  // Fixed structural size (legs, head, arms don't grow)
  const legR=game.baseRadius;
  // Belly expands independently
  const bellyR=game.baseRadius+game.fillLevel*400;
  const scale=game.bellyScale;

  // Walking bob
  let bobY=0;
  if(game.state===State.WALKING&&!game.bearDead){
    bobY=Math.sin(game.walkTimer*0.15)*4;
  }
  ctx.translate(0,bobY);

  // --- Shadow on ground ---
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath();ctx.ellipse(0,legR*1.15,legR*0.9,legR*0.12,0,0,Math.PI*2);ctx.fill();

  // --- BODY (belly — grows independently) ---
  // Belly center is at fixed legR*0.2 from origin (matching leg structure)
  const bellyCx=0, bellyCy=legR*0.2;
  // Draw large belly behind legs
  const bellyGrad=ctx.createRadialGradient(bellyCx-bellyR*0.2,bellyCy-bellyR*0.3,0,bellyCx,bellyCy,bellyR*scale);
  bellyGrad.addColorStop(0,'#C4956A');
  bellyGrad.addColorStop(0.7,'#8B5E3C');
  bellyGrad.addColorStop(1,'#6B3F1F');
  ctx.fillStyle=bellyGrad;
  ctx.beginPath();ctx.arc(bellyCx,bellyCy,bellyR*scale,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5A3520';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bellyCx,bellyCy,bellyR*scale,0,Math.PI*2);ctx.stroke();

  // Darker belly center (follows belly center)
  ctx.fillStyle='#D4A574';
  ctx.beginPath();ctx.ellipse(bellyCx,bellyCy+bellyR*0.2,bellyR*0.5*scale,bellyR*0.4*scale,0,0,Math.PI*2);ctx.fill();

  // Nipple dots (fixed position near belly center)
  ctx.fillStyle='#5A3520';
  ctx.beginPath();ctx.arc(bellyCx-legR*0.2,bellyCy-legR*0.05,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bellyCx+legR*0.2,bellyCy-legR*0.05,3,0,Math.PI*2);ctx.fill();

  // Stress cracks when belly is critical (fillLevel > 0.85)
  if(game.fillLevel>0.85&&game.state!==State.BURST){
    ctx.strokeStyle='rgba(255,50,50,0.5)';ctx.lineWidth=2;
    const crackPhase=game.gameTime*0.05;
    for(let i=0;i<5;i++){
      const a=crackPhase+i*1.3;
      const r1=bellyR*scale*0.5,r2=bellyR*scale*0.9;
      const sx=bellyCx+Math.cos(a)*r1,sAy=bellyCy+Math.sin(a)*r1;
      const ex=bellyCx+Math.cos(a+0.3)*r2,sBy=bellyCy+Math.sin(a+0.3)*r2;
      ctx.beginPath();ctx.moveTo(sx,sAy);
      ctx.lineTo(bellyCx+Math.cos(a+0.15)*(r1+r2)*0.5,bellyCy+Math.sin(a+0.15)*(r1+r2)*0.5);
      ctx.lineTo(ex,sBy);ctx.stroke();
    }
  }

  // --- LEGS (fixed size, planted on ground) ---
  const legH=legR*0.5;
  // Left leg
  ctx.fillStyle='#7A4E2D';
  roundRect(ctx,-legR*0.5,legR*0.5,legR*0.3,legH,6);ctx.fill();
  // Right leg
  roundRect(ctx,legR*0.2,legR*0.5,legR*0.3,legH,6);ctx.fill();
  // Feet
  ctx.fillStyle='#5A3520';
  ctx.beginPath();ctx.ellipse(-legR*0.35,legR*0.5+legH,legR*0.2,legR*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(legR*0.35,legR*0.5+legH,legR*0.2,legR*0.12,0,0,Math.PI*2);ctx.fill();

  // --- ARMS (fixed size, animated) ---
  if(game.state!==State.BURST&&game.state!==State.GAME_OVER){
    let armSwing=0;
    if(game.state===State.WALKING){
      // Searching / desperate walk: arms reach forward
      armSwing=Math.sin(game.walkTimer*0.12)*0.4;
    }
    ctx.fillStyle='#7A4E2D';
    // Left arm
    ctx.save();
    ctx.translate(-legR*0.8,legR*0.1);
    ctx.rotate(-0.4+armSwing);
    roundRect(ctx,-4,0,8,legR*0.45,5);ctx.fill();
    ctx.restore();
    // Right arm
    ctx.save();
    ctx.translate(legR*0.8,legR*0.1);
    ctx.rotate(0.4-armSwing);
    roundRect(ctx,-4,0,8,legR*0.45,5);ctx.fill();
    ctx.restore();
  }

  // --- HEAD (fixed size, animated for thirsty search) ---
  const headY=-legR*0.7;
  const headR=legR*0.55;

  // Head tilt: combine drinking tilt with walking look-around
  let headAngle=game.headTilt;
  if(game.state===State.WALKING){
    // During walk, head looks around searching for water
    headAngle+=Math.sin(game.walkTimer*0.08)*0.12 + Math.sin(game.walkTimer*0.03)*0.08;
  }
  // Sniff motion: occasional head drop
  const sniff=Math.max(0,Math.sin(game.walkTimer*0.05))*0.1;
  const headBobY=game.state===State.WALKING?sniff*legR*0.3:0;

  ctx.save();
  ctx.translate(0,headY+headBobY);
  ctx.rotate(headAngle);

  // Ears
  ctx.fillStyle='#6B3F1F';
  ctx.beginPath();ctx.arc(-headR*0.7,-headR*0.75,headR*0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(headR*0.7,-headR*0.75,headR*0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#D4A574';
  ctx.beginPath();ctx.arc(-headR*0.7,-headR*0.75,headR*0.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(headR*0.7,-headR*0.75,headR*0.15,0,Math.PI*2);ctx.fill();

  // Head
  const headGrad=ctx.createRadialGradient(-headR*0.2,-headR*0.3,0,0,0,headR);
  headGrad.addColorStop(0,'#C4956A');
  headGrad.addColorStop(1,'#8B5E3C');
  ctx.fillStyle=headGrad;
  ctx.beginPath();ctx.arc(0,0,headR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5A3520';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(0,0,headR,0,Math.PI*2);ctx.stroke();

  // Snout
  ctx.fillStyle='#D4A574';
  ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.4,headR*0.3,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5A3520';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.4,headR*0.3,0,0,Math.PI*2);ctx.stroke();

  // Nose
  ctx.fillStyle='#2C1810';
  ctx.beginPath();ctx.ellipse(0,headR*0.15,headR*0.12,headR*0.08,0,0,Math.PI*2);ctx.fill();

  // Mouth
  if((game.tongueOut||game.drinkCount>10)&&game.state!==State.DRINKING&&game.state!==State.BURST){
    ctx.fillStyle='#D32F2F';
    ctx.beginPath();ctx.ellipse(0,headR*0.4,headR*0.15,headR*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#E57373';
    ctx.beginPath();ctx.ellipse(0,headR*0.42,headR*0.08,headR*0.12,0,0,Math.PI*2);ctx.fill();
  }else{
    ctx.strokeStyle='#2C1810';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,headR*0.3,headR*0.15,0.1,Math.PI-0.1);ctx.stroke();
  }

  // Eyes
  if(game.state===State.BURST||game.state===State.GAME_OVER){
    ctx.strokeStyle='#2C1810';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-headR*0.3,-headR*0.15);ctx.lineTo(-headR*0.1,-headR*0.35);ctx.moveTo(-headR*0.1,-headR*0.15);ctx.lineTo(-headR*0.3,-headR*0.35);ctx.stroke();
    ctx.beginPath();ctx.moveTo(headR*0.1,-headR*0.15);ctx.lineTo(headR*0.3,-headR*0.35);ctx.moveTo(headR*0.3,-headR*0.15);ctx.lineTo(headR*0.1,-headR*0.35);ctx.stroke();
  }else if(game.drinkCount>10){
    ctx.fillStyle='#FFF';
    ctx.beginPath();ctx.ellipse(-headR*0.25,-headR*0.1,headR*0.18,headR*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(headR*0.25,-headR*0.1,headR*0.18,headR*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2C1810';
    ctx.beginPath();ctx.arc(-headR*0.25,-headR*0.05,headR*0.08,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(headR*0.25,-headR*0.05,headR*0.08,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2C1810';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-headR*0.4,-headR*0.35);ctx.lineTo(-headR*0.1,-headR*0.25);ctx.stroke();
    ctx.beginPath();ctx.moveTo(headR*0.4,-headR*0.35);ctx.lineTo(headR*0.1,-headR*0.25);ctx.stroke();
  }else if(game.drinkCount>7){
    ctx.strokeStyle='#2C1810';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-headR*0.22,-headR*0.15,headR*0.08,0,Math.PI);ctx.stroke();
    ctx.beginPath();ctx.arc(headR*0.22,-headR*0.15,headR*0.08,0,Math.PI);ctx.stroke();
  }else{
    ctx.fillStyle='#2C1810';
    ctx.beginPath();ctx.arc(-headR*0.22,-headR*0.15,headR*0.07,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(headR*0.22,-headR*0.15,headR*0.07,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';
    ctx.beginPath();ctx.arc(-headR*0.19,-headR*0.18,headR*0.025,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(headR*0.29,-headR*0.18,headR*0.025,0,Math.PI*2);ctx.fill();
  }

  ctx.restore(); // head tilt
  ctx.restore(); // global transform

  // Sweat drops (during walking to show thirst, and always when tongue out or warning)
  if(game.state===State.WALKING||game.tongueOut||game.drinkCount>10){
    for(const d of game.sweatDrops){
      ctx.fillStyle='rgba(100,180,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(bx+d.x,by+headY+d.y,d.w,d.h,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(bx+d.x-d.w*0.2,by+headY+d.y-d.h*0.2,d.w*0.3,d.h*0.3,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  ctx.restore(); // alpha
}

// ----- Dog -----
function drawDog(){
  const dx=dogCenterX(),dy=dogCenterY();
  const s=Math.min(W,H)*0.04;
  const laughPhase=game.dogRollPhase;

  ctx.save();
  ctx.translate(dx,dy);

  // Shadow on ground
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath();ctx.ellipse(0,s*0.1,s*0.7,s*0.15,0,0,Math.PI*2);ctx.fill();

  // Shake when laughing hard
  if(game.dogShake>0.5){
    ctx.translate((Math.random()-0.5)*game.dogShake,(Math.random()-0.5)*game.dogShake);
  }
  ctx.scale(game.dogScale,game.dogScale);

  // Pet reaction: big happy jump
  const petBounce=game.petTimer>0?Math.sin(game.gameTime*0.25)*s*0.25:0;
  // Laugh bounce: puppy bounces up and down, wiggles side-to-side
  const bounce=Math.abs(Math.sin(laughPhase))*s*0.18+Math.abs(petBounce);
  const wiggle=Math.sin(laughPhase*1.7)*s*0.04;
  ctx.translate(wiggle,-bounce);

  // Tail (wagging rapidly)
  ctx.strokeStyle='#D4A574';ctx.lineWidth=s*0.16;ctx.lineCap='round';
  const tailWag=Math.sin(laughPhase*3)*0.5;
  ctx.beginPath();ctx.moveTo(-s*0.3,-s*0.4);
  ctx.quadraticCurveTo(-s*0.5-tailWag*s,-s*0.9,-s*0.3-tailWag*s,-s*1.2);
  ctx.stroke();

  // Back legs (sitting)
  ctx.fillStyle='#C97B5D';
  ctx.beginPath();ctx.ellipse(-s*0.3,s*0.05,s*0.18,s*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.3,s*0.05,s*0.18,s*0.12,0,0,Math.PI*2);ctx.fill();

  // Body (sitting upright — oval tapering to bottom)
  ctx.fillStyle='#E8A87C';
  ctx.beginPath();ctx.ellipse(0,-s*0.5,s*0.55,s*0.5,0,0,Math.PI*2);ctx.fill();
  // Belly patch
  ctx.fillStyle='#FFF3E0';
  ctx.beginPath();ctx.ellipse(0,-s*0.35,s*0.28,s*0.3,0,0,Math.PI*2);ctx.fill();

  // Front legs (sticking forward, bouncing)
  ctx.fillStyle='#E8A87C';
  const frontY=-s*0.15+bounce*0.3;
  ctx.beginPath();ctx.ellipse(-s*0.2,frontY,s*0.15,s*0.2,-0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.2,frontY,s*0.15,s*0.2,0.3,0,Math.PI*2);ctx.fill();
  // Paw pads
  ctx.fillStyle='#FFCCBC';
  ctx.beginPath();ctx.arc(-s*0.2,frontY+s*0.15,s*0.05,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.2,frontY+s*0.15,s*0.05,0,Math.PI*2);ctx.fill();

  // Head
  ctx.fillStyle='#E8A87C';
  ctx.beginPath();ctx.arc(0,-s*1.0,s*0.4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#C97B5D';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,-s*1.0,s*0.4,0,Math.PI*2);ctx.stroke();

  // Floppy ears
  ctx.fillStyle='#C97B5D';
  ctx.beginPath();ctx.ellipse(-s*0.35,-s*0.8,s*0.12,s*0.25,-0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.35,-s*0.8,s*0.12,s*0.25,0.3,0,Math.PI*2);ctx.fill();

  // Snout
  ctx.fillStyle='#FFF3E0';
  ctx.beginPath();ctx.ellipse(0,-s*0.85,s*0.2,s*0.12,0,0,Math.PI*2);ctx.fill();

  // Nose
  ctx.fillStyle='#2C1810';
  ctx.beginPath();ctx.arc(0,-s*0.9,s*0.06,0,Math.PI*2);ctx.fill();

  // Eyes (big cute shiny)
  ctx.fillStyle='#2C1810';
  ctx.beginPath();ctx.arc(-s*0.14,-s*1.08,s*0.06,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.14,-s*1.08,s*0.06,0,Math.PI*2);ctx.fill();
  // Eye shine
  ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.arc(-s*0.12,-s*1.1,s*0.025,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.16,-s*1.1,s*0.025,0,Math.PI*2);ctx.fill();

  // Tongue (hanging out, wiggles with laugh)
  ctx.fillStyle='#E57373';
  ctx.beginPath();ctx.ellipse(s*0.06,-s*0.76+Math.sin(laughPhase*2)*s*0.02,s*0.07,s*0.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#D32F2F';
  ctx.beginPath();ctx.ellipse(s*0.06,-s*0.74+Math.sin(laughPhase*2)*s*0.02,s*0.04,s*0.06,0,0,Math.PI*2);ctx.fill();

  ctx.restore();

  // Speech bubble when belly ~50% full
  if(game.drinkCount>=8){
    const bubbleY=dy-s*2.2;
    const bubbleTexts=['LOL','ROFL','HAHAHA','LMAO','DEAD'];
    const speed=game.state===State.GAME_OVER?0.05:0.018;
    const bubbleIdx=Math.floor(game.gameTime*speed)%bubbleTexts.length;
    drawBubble(dx,bubbleY,bubbleTexts[bubbleIdx],s*0.55,'#FFF','#555','rgba(0,0,0,0.1)');
  }
}

// ----- Speech Bubbles -----
function drawBubble(x,y,text,size,bg,fg,shadow){
  const pad=size*0.3;
  const w=ctx.measureText?ctx.measureText(text).width+pad*2:size*4;
  const h=size*1.6;
  const r=size*0.3;
  // Shadow
  if(shadow){
    ctx.fillStyle=shadow;
    roundRect(ctx,x-w/2+3,y-h+3,w,h,r);ctx.fill();
  }
  // Bubble
  ctx.fillStyle=bg;
  ctx.strokeStyle=fg;
  ctx.lineWidth=1.5;
  roundRect(ctx,x-w/2,y-h,w,h,r);ctx.fill();ctx.stroke();
  // Tail
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(x-size*0.4,y-2);ctx.lineTo(x,y+size*0.2);ctx.lineTo(x+size*0.4,y-2);ctx.fill();
  ctx.strokeStyle=fg;
  ctx.beginPath();ctx.moveTo(x-size*0.4,y-2);ctx.lineTo(x,y+size*0.2);ctx.lineTo(x+size*0.4,y-2);ctx.stroke();
  // Text
  ctx.fillStyle=fg;
  ctx.font=`bold ${size}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x,y-h/2);
}

function drawIntroBubble(){
  if(!game.introBubble||game.introBubbleAlpha<=0) return;
  const bx=game.bearX,by=game.bearY-H*0.15;
  ctx.globalAlpha=game.introBubbleAlpha;
  drawBubble(bx,by,game.introBubble,Math.min(W,H)*0.025,'#FFF','#333','rgba(0,0,0,0.15)');
  ctx.globalAlpha=1;
}

function drawStopBubble(){
  if(!game.stopBubble.show) return;
  const bx=game.bearX,by=game.bearY-H*0.3;
  const s=game.stopBubble.scale;
  const shakeX=game.stopBubble.shakeX;
  const shakeY=game.stopBubble.shakeY;

  ctx.save();
  ctx.translate(bx+shakeX,by+shakeY);
  ctx.scale(s,s);

  const r=Math.min(W,H)*0.08;
  const w=r*2.5;
  // Comic bubble
  ctx.fillStyle='#FFD700';
  ctx.strokeStyle='#D32F2F';ctx.lineWidth=4;
  roundRect(ctx,-w/2,-r,w,r*1.6,r*0.3);ctx.fill();ctx.stroke();

  // Double border
  ctx.strokeStyle='#FF8A80';ctx.lineWidth=2;
  roundRect(ctx,-w/2+4,-r+4,w-8,r*1.6-8,r*0.25);ctx.stroke();

  // Tail
  ctx.fillStyle='#FFD700';ctx.strokeStyle='#D32F2F';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,r*0.7);ctx.lineTo(-r*0.3,r*1.2);ctx.lineTo(r*0.3,r*1.2);ctx.closePath();ctx.fill();ctx.stroke();

  // Text
  ctx.fillStyle='#D32F2F';
  ctx.font=`bold ${r*0.7}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('STOP!!',0,0);
  // Outline on text
  ctx.strokeStyle='#FFF';ctx.lineWidth=2;
  ctx.strokeText('STOP!!',0,0);

  ctx.restore();
}

function drawPrompt(){
  if(!game.showPrompt) return;
  ctx.globalAlpha=game.promptAlpha;
  const bx=bottleCenterX(),by=bottleCenterY();

  // Pulsing ring around bottle
  const ringR=Math.min(W,H)*0.08+Math.sin(game.gameTime*0.005)*Math.min(W,H)*0.015;
  ctx.strokeStyle=`rgba(255,200,50,${0.3+0.2*Math.sin(game.gameTime*0.005)})`;
  ctx.lineWidth=3;ctx.setLineDash([6,8]);
  ctx.beginPath();ctx.arc(bx,by,ringR,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  // Second ring (opposite phase)
  const ringR2=Math.min(W,H)*0.09+Math.sin(game.gameTime*0.005+Math.PI)*Math.min(W,H)*0.012;
  ctx.strokeStyle=`rgba(255,200,50,${0.15+0.15*Math.sin(game.gameTime*0.005+Math.PI)})`;
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bx,by,ringR2,0,Math.PI*2);ctx.stroke();

  // Small label next to bottle
  const s=Math.min(W,H)*0.015;
  const lx=bx-Math.min(W,H)*0.1,ly=by+s*0.2;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;
  roundRect(ctx,lx-s*0.4,ly-s*0.2,s*3.5,s*1.1,s*0.25);ctx.fill();ctx.stroke();
  ctx.fillStyle='#E65100';ctx.font=`bold ${s*0.7}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💧 Hold!',lx+s*1.3,ly+s*0.35);
  ctx.globalAlpha=1;
}

// ----- Particles -----
function updateParticles(){
  for(let i=game.burstParticles.length-1;i>=0;i--){
    const p=game.burstParticles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.3;
    p.life-=p.decay;
    p.rot+=p.rotV;
    if(p.life<=0){game.burstParticles.splice(i,1);continue;}
  }
}

function drawParticles(){
  for(const p of game.burstParticles){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    if(p.type==='fur'){
      ctx.beginPath();ctx.ellipse(0,0,p.w,p.h,p.rot,0,Math.PI*2);ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(0,0,p.w,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

        o.body=carColors[ci];o.roof=roofs[ci];
      }else if(o.type==='cloud'){
        o.x=-o.size*2;o.y=H*(0.03+Math.random()*0.27);
        o.speed=(Math.random()>0.4?1:-1)*(0.1+Math.random()*0.4);

// ----- Drink Stream -----
function drawStream(){
  if(!game.isStreaming) return;
  const bh=Math.min(W,H)*0.12;
  const bx=bottleCenterX(),by=bottleCenterY();
  // Stream origin follows bottle cap (which tilts toward bear when feeding)
  const startX=bx+(game.feeding?Math.sin(game.bottleAngle)*bh*0.85:0);
  const startY=by-(game.feeding?Math.cos(game.bottleAngle)*bh*0.85:bh*0.65);
  const endX=game.bearX,endY=game.bearY-H*0.35;
  const progress=game.streamProgress;

  ctx.save();
  ctx.globalAlpha=1-progress*0.3;

  // Water stream
  const steps=20;
  for(let i=0;i<steps;i++){
    const t=i/steps;
    const dist=t*progress;
    const x=startX+(endX-startX)*dist;
    const y=startY+(endY-startY)*dist;
    const wobble=Math.sin(t*20+game.gameTime*0.05)*3;
    const r=4*(1-dist*0.3);
    ctx.fillStyle=`rgba(100,180,255,${0.6*(1-dist)})`;
    ctx.beginPath();ctx.arc(x+wobble,y,r,0,Math.PI*2);ctx.fill();
  }
  // Splash at bear's mouth
  if(progress>0.8){
    const splash=Math.sin(game.gameTime*0.05)*3;
    ctx.fillStyle=`rgba(100,180,255,${0.4*(1-(progress-0.8)/0.2)})`;
    ctx.beginPath();ctx.arc(endX+Math.random()*6-3,endY+Math.random()*6-3,3+splash,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(endX+Math.random()*6-3,endY+Math.random()*6-3,2,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

// ----- BOOM! Text -----
function drawBoomText(){
  if(!game.boomText.show||game.boomText.alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=game.boomText.alpha;
  const cx=game.bearX,cy=game.bearY-H*0.25;
  ctx.translate(cx,cy);
  const s=game.boomText.scale;
  ctx.scale(s,s);

  // Expanding shockwave rings
  const waveR=Math.min(W,H)*(0.08+game.burstTimer*0.004);
  for(let i=0;i<3;i++){
    const r=waveR+i*Math.min(W,H)*0.04;
    ctx.strokeStyle=`rgba(255,200,50,${Math.max(0,0.25-i*0.08)*game.boomText.alpha})`;
    ctx.lineWidth=3-i;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  }

  // Text wobble
  const wobX=Math.sin(game.gameTime*0.08)*4;
  const wobY=Math.cos(game.gameTime*0.06)*3;
  // Shadow layers (depth)
  const fontSize=Math.min(W,H)*0.26;
  for(let i=4;i>0;i--){
    ctx.fillStyle=`rgba(0,0,0,${0.08+i*0.06})`;
    ctx.font=`900 ${fontSize}px 'Arial Black','Impact',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('BOOM!',i*2+wobX,i*2+wobY);
  }
  // Outer stroke
  ctx.strokeStyle='#B71C1C';ctx.lineWidth=10;
  ctx.font=`900 ${fontSize}px 'Arial Black','Impact',sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeText('BOOM!',wobX,wobY);
  // Mid stroke
  ctx.strokeStyle='#FF6F00';ctx.lineWidth=6;
  ctx.strokeText('BOOM!',wobX,wobY);
  // Inner stroke
  ctx.strokeStyle='#FFD600';ctx.lineWidth=3;
  ctx.strokeText('BOOM!',wobX,wobY);
  // Fill
  ctx.fillStyle='#FFF';
  ctx.fillText('BOOM!',wobX,wobY);

  // Stars / sparkles around the text
  const starCount=8+Math.floor(game.burstTimer*0.15);
  for(let i=0;i<starCount;i++){
    const a=i*2.4+game.burstTimer*0.02;
    const dist=fontSize*(0.5+Math.sin(i*1.7+game.burstTimer*0.03)*0.3);
    const sx=Math.cos(a)*dist+wobX,sy=Math.sin(a)*dist+wobY;
    const starS=3+Math.sin(i*3+game.burstTimer*0.05)*2;
    ctx.fillStyle=['#FFD600','#FF6F00','#FFF','#FF1744','#00E5FF'][i%5];
    ctx.font=`${starS*2}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✦',sx,sy);
  }

  // Subtitle (appears after a moment)
  if(game.burstTimer>15){
    const subAlpha=Math.min(1,(game.burstTimer-15)/15)*game.boomText.alpha;
    ctx.globalAlpha=subAlpha;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.font=`bold ${Math.min(W,H)*0.05}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText("That's gonna leave a mark!",2,fontSize*0.5+4);
    ctx.fillStyle='#FFF';
    ctx.strokeStyle='#333';ctx.lineWidth=2;
    ctx.strokeText("That's gonna leave a mark!",0,fontSize*0.5);
    ctx.fillText("That's gonna leave a mark!",0,fontSize*0.5);
  }

  ctx.restore();
}

// ===================== UTILITY =======================================
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

  };

function startGame(){
  resetGame();
  game.state=State.WALKING;
  game.bearX=-Math.min(W*0.25,150);
  game.bearY=bearCenterY();
  game.targetX=bearCenterX();
  game.isWalking=true;
  game.introStage=0;
  document.body.style.backgroundColor='#2E4053';
  updateHighScoreDisplay();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').classList.remove('show');
  document.getElementById('gameOverScreen').style.display='none';
}

function feedTick(){
  if(!game.canDrink||game.state===State.BURST||game.state===State.GAME_OVER) return;
  // Tilt bottle horizontal toward bear (-86°, pivot from bottom)
  game.bottleAngle=-1.5+Math.sin(game.gameTime*0.05)*0.06;
  // Slow feed rate (~14 seconds to fill at 60fps)
  game.fillLevel=Math.min(1,game.fillLevel+0.0012);
  game.drinkCount=Math.floor(game.fillLevel*15);
  // Stream
  game.isStreaming=true;
  game.streamProgress=(game.streamProgress+0.025)%1;
  // Belly pulse
  game.targetBellyScale=1.06+Math.sin(game.gameTime*0.12)*0.04;
  // Head tilt
  game.headTilt=-0.1;
  // Periodic slurp
  if(game.gameTime%6===0) Sound.slurp();
  // +1 every so often
  if(game.gameTime%12===0) spawnPlusOne();
  // Check warning
  if(game.fillLevel>0.67&&game.fillLevel<1&&!game.stopBubble.show){
    game.stopBubble.show=true;
    game.stopBubble.scale=0.01;
    Sound.warning();
  }
  // Check burst
  if(game.fillLevel>=1){
    triggerBurst();
  }
}

function triggerBurst(){
  game.state=State.BURST;
  game.bearDead=true;
  game.burstTimer=0;
  game.stopBubble.show=false;
  game.boomText={show:true,scale:0.01,alpha:1};
  // Instant belly SNAP for dramatic pop
  game.bellyScale=4;
  game.targetBellyScale=4;
  Sound.burst();
  spawnBurstParticles();
  spawnConfetti();
  // Strobe flash
  for(let t=0;t<400;t+=80){
    setTimeout(()=>{document.body.style.backgroundColor='#FFF'},t);
    setTimeout(()=>{document.body.style.backgroundColor='#FF1744'},t+30);
  }
  setTimeout(()=>{document.body.style.backgroundColor='#2E4053'},450);
}

function endGame(){
  game.state=State.GAME_OVER;
  saveHighScore(game.popScore);
  const gos=document.getElementById('gameOverScreen');
  const hs=localStorage.getItem('bearFeedHighScore');
  document.getElementById('goStats').textContent=`⭐ ${game.popScore}   🏆 ${hs||'0'}`;
  gos.style.display='flex';
  gos.classList.add('show');
}

  // Cars on the road (big)
  const carColors=['#D32F2F','#1976D2','#388E3C','#F57C00','#7B1FA2','#616161','#FDD835','#00796B'];
  for(let i=0;i<7;i++){
    flyingObjects.push({
      type:'car',x:Math.random()*W,
      y:groundY()+H*r(0.005,0.045),
      speed:r(0.5,1.8),size:r(22,36),
      body:carColors[i%carColors.length],
      roof:['#B71C1C','#0D47A1','#1B5E20','#E65100','#4A148C','#424242','#F9A825','#004D40'][i%carColors.length]
    });
  }
}

function drawPlane(o){
  ctx.save();ctx.translate(o.x,o.y);
  const s=o.size;
  // Fuselage
  ctx.fillStyle=o.body;ctx.strokeStyle='#999';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,0,s*0.9,s*0.25,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Main wing
  ctx.fillStyle=o.wing;ctx.strokeStyle='#888';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(-s*0.1,-s*0.05);ctx.lineTo(s*0.3,-s*0.45);ctx.lineTo(s*0.35,-s*0.35);ctx.lineTo(s*0.05,-s*0.02);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*0.1,s*0.05);ctx.lineTo(s*0.3,s*0.45);ctx.lineTo(s*0.35,s*0.35);ctx.lineTo(s*0.05,s*0.02);ctx.closePath();ctx.fill();ctx.stroke();
  // Tail
  ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.02);ctx.lineTo(-s*0.75,-s*0.3);ctx.lineTo(-s*0.65,-s*0.3);ctx.lineTo(-s*0.55,-s*0.02);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*0.6,s*0.02);ctx.lineTo(-s*0.75,s*0.25);ctx.lineTo(-s*0.65,s*0.25);ctx.lineTo(-s*0.55,s*0.02);ctx.closePath();ctx.fill();
  // Accent stripe
  ctx.strokeStyle=o.accent;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-s*0.5,0);ctx.lineTo(s*0.4,0);ctx.stroke();
  // Window
  ctx.fillStyle='#B3E5FC';ctx.strokeStyle='#666';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.arc(s*0.15,0,s*0.07,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(s*0.3,0,s*0.05,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
}

function drawBalloon(o){
  ctx.save();ctx.translate(o.x,o.y);
  const s=o.size;
  // Balloon envelope
  const grad=ctx.createRadialGradient(-s*0.25,-s*0.4,0,0,-s*0.1,s*0.9);
  grad.addColorStop(0,o.secondary);grad.addColorStop(1,o.color);
  ctx.fillStyle=grad;ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,-s*0.15,s*0.85,s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Decorative stripes
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-s*0.3,-s*0.6);ctx.lineTo(s*0.3,-s*0.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*0.5,-s*0.15);ctx.lineTo(s*0.5,-s*0.15);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*0.3,s*0.3);ctx.lineTo(s*0.3,s*0.3);ctx.stroke();
  // Ropes
  ctx.strokeStyle='#6D4C41';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-s*0.35,s*0.7);ctx.lineTo(-s*0.15,s*1.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*0.35,s*0.7);ctx.lineTo(s*0.15,s*1.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,s*0.75);ctx.lineTo(0,s*1.2);ctx.stroke();
  // Basket
  ctx.fillStyle='#8D6E63';ctx.strokeStyle='#5D4037';ctx.lineWidth=1;
  ctx.fillRect(-s*0.18,s*1.2,s*0.36,s*0.2);ctx.strokeRect(-s*0.18,s*1.2,s*0.36,s*0.2);
  ctx.fillStyle='#6D4C41';
  ctx.fillRect(-s*0.18,s*1.2,s*0.36,s*0.04);
  ctx.restore();
}

function drawCar(o){
  ctx.save();ctx.translate(o.x,o.y);
  const s=o.size;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(0,s*0.15,s*0.9,s*0.12,0,0,Math.PI*2);ctx.fill();
  // Body
  ctx.fillStyle=o.body;ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
  roundRect(ctx,-s*0.8,-s*0.05,s*1.6,s*0.5,s*0.2);ctx.fill();ctx.stroke();
  // Roof / cabin
  ctx.fillStyle=o.roof;
  ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.05);ctx.lineTo(-s*0.3,-s*0.55);ctx.lineTo(s*0.25,-s*0.55);ctx.lineTo(s*0.4,-s*0.05);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.05);ctx.lineTo(-s*0.3,-s*0.55);ctx.lineTo(s*0.25,-s*0.55);ctx.lineTo(s*0.4,-s*0.05);ctx.closePath();ctx.stroke();
  // Windshield
  ctx.fillStyle='#B3E5FC';ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-s*0.15,-s*0.08);ctx.lineTo(-s*0.22,-s*0.45);ctx.lineTo(s*0.08,-s*0.45);ctx.lineTo(s*0.2,-s*0.08);ctx.closePath();ctx.fill();ctx.stroke();
  // Rear window
  ctx.beginPath();ctx.moveTo(s*0.15,-s*0.08);ctx.lineTo(s*0.12,-s*0.42);ctx.lineTo(s*0.28,-s*0.35);ctx.lineTo(s*0.3,-s*0.08);ctx.closePath();ctx.fill();ctx.stroke();
  // Wheels
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.ellipse(-s*0.45,s*0.45,s*0.18,s*0.14,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.45,s*0.45,s*0.18,s*0.14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';
  ctx.beginPath();ctx.arc(-s*0.45,s*0.45,s*0.06,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.45,s*0.45,s*0.06,0,Math.PI*2);ctx.fill();
  // Headlight (front)
  ctx.fillStyle='#FFEB3B';
  ctx.beginPath();ctx.arc(s*0.75,s*0.05,s*0.06,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawCloudObj(o){
  ctx.save();ctx.translate(o.x,o.y);
  const s=o.size;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath();ctx.arc(0,0,s*0.6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.45,-s*0.08,s*0.45,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.9,0,s*0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.4,s*0.2,s*0.35,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBird(o){
  ctx.save();ctx.translate(o.x,o.y);
  const s=o.size;
  const flap=Math.sin(game.gameTime*0.08+o.x)*0.3;
  ctx.strokeStyle=o.color;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-s*0.8,flap*s*0.3);ctx.quadraticCurveTo(-s*0.2,0,0,-s*0.2);
  ctx.quadraticCurveTo(s*0.2,0,s*0.8,flap*s*0.3);
  ctx.stroke();
  ctx.restore();
}

function updateFlyingObjects(){
  for(const o of flyingObjects){
    if(o.type==='cloud'){
      o.x+=o.speed;
      if(o.x>W+o.size*2) o.x=-o.size*2;
    }else if(o.type==='bird'){
      o.x+=o.speed;
      if(o.x>W+o.size*2) o.x=-o.size*2;
    }else if(o.type==='plane'){
      o.x+=o.speed;
      if(o.x>W+o.size*2) o.x=-o.size*2;
    }else if(o.type==='car'){
      o.x+=o.speed;
      if(o.x>W+o.size*2) o.x=-o.size*2;
    }else{ // balloon
      o.x+=o.speedX;o.y+=o.speedY;
      if(o.y<-o.size*2) o.y=groundY()-o.size*2;
      if(o.x<-o.size*2) o.x=W+o.size*2;
      if(o.x>W+o.size*2) o.x=-o.size*2;
    }
  }
}

function drawFlyingObjects(){
  // Sky objects (back to front)
  for(const o of flyingObjects){
    if(o.type==='cloud') drawCloudObj(o);
    else if(o.type==='bird') drawBird(o);
    else if(o.type==='plane') drawPlane(o);
    else if(o.type==='balloon') drawBalloon(o);
  }
  // Cars on road (on top of everything else)
  for(const o of flyingObjects){
    if(o.type==='car') drawCar(o);
  }
}

// ===================== CITY BUILDINGS ================================
let buildings=[];

function initBuildings(){
  buildings=[];
  const count=8+Math.floor(W/120);
  const slot=W/count;
  for(let i=0;i<count;i++){
    const bh=H*(0.06+Math.random()*0.2);
    const colors=['#8D6E63','#5C6BC0','#26A69A','#EF5350','#66BB6A','#FFA726','#AB47BC','#78909C'];
    const roofs=['#6D4C41','#3949AB','#00897B','#C62828','#43A047','#F57C00','#8E24AA','#546E7A'];
    const gap=slot*0.12;
    buildings.push({
      x:i*slot+gap/2,w:slot-gap,h:bh,
      color:colors[i%colors.length],roof:roofs[i%roofs.length],
      doors:1+Math.floor(Math.random()*2),
      winRows:1+Math.floor(Math.random()*2),
      winCols:1+Math.floor(Math.random()*2)
    });
  }
}

function drawBuildings(){
  const bot=groundY()-H*0.02;
  for(const b of buildings){
    const top=bot-b.h;
    // Wall
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,top,b.w,b.h);
    // Roof line
    ctx.fillStyle=b.roof;
    ctx.fillRect(b.x-1,top-3,b.w+2,5);
    // Windows
    const ww=b.w*0.18,wh=b.h*0.12,gapX=b.w*0.12,gapY=b.h*0.15;
    const startY=top+b.h*0.12;
    for(let r=0;r<b.winRows;r++){
      for(let c=0;c<b.winCols;c++){
        const wx=b.x+gapX+c*(ww+gapX);
        const wy=startY+r*(wh+gapY);
        if(wx+ww<b.x+b.w-2){
          ctx.fillStyle='#FFF9C4';ctx.fillRect(wx,wy,ww,wh);
          ctx.fillStyle='#F9A825';ctx.fillRect(wx+ww*0.1,wy+wh*0.1,ww*0.3,wh*0.3);
        }
      }
    }
    // Door
    const dw=b.w*0.22,dh=b.h*0.25;
    const dx=b.x+(b.w-dw)/2;
    ctx.fillStyle='#5D4037';ctx.fillRect(dx,bot-dh,dw,dh);
    ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(dx+dw-4,bot-dh/2,2,0,Math.PI*2);ctx.fill();
  }
}

// ===================== UPDATE ========================================
function update(){
  game.gameTime++;
  updateFlyingObjects();

  // Continuous feeding while holding bottle
  if(game.feeding){
    feedTick();
  }else if(game.isStreaming){
    game.isStreaming=false;
  }

  // Belly slowly deflates when not feeding (only after feeding has started)
  if(!game.feeding && game.canDrink && game.fillLevel>0 && game.state!==State.BURST && game.state!==State.GAME_OVER){
    game.fillLevel=Math.max(0,game.fillLevel-0.0005);
    game.drinkCount=Math.floor(game.fillLevel*15);
    // Clear warning if fill drops below threshold
    if(game.fillLevel<=0.65 && game.stopBubble.show){
      game.stopBubble.show=false;
      game.state=State.THIRSTY;
    }
  }

  // Dog ROFL + laugh starts when belly is ~50% full
  const dogActive=game.drinkCount>=8;
  if(dogActive){
    game.dogRollPhase+=0.035;
    game.dogLaughTimer--;
    if(game.dogLaughTimer<=0){
      const interval=game.state===State.GAME_OVER?60:120;
      game.dogLaughTimer=interval;
    }
  }else if(game.state!==State.START){
    // Very subtle idle sway before activation
    game.dogRollPhase+=0.003;
  }

  // Dog grows when bear bursts (always active regardless of drinkCount)
  if(game.state===State.BURST||game.state===State.GAME_OVER){
    game.dogTargetScale=1.8;
    game.dogShake=8+Math.random()*6;
  }else{
    game.dogTargetScale=1;
    if(game.dogShake>0) game.dogShake*=0.9;
  }
  game.dogScale+=(game.dogTargetScale-game.dogScale)*0.05;

  // Walking intro
  if(game.state===State.WALKING){
    game.walkTimer++;
    const walkSpeed=Math.max(2,W*0.002);
    if(game.bearX<game.targetX){
      game.bearX+=walkSpeed;
      if(game.walkTimer%Math.max(6,Math.floor(16-walkSpeed))===0) Sound.walk();
    }else{
      game.bearX=game.targetX;
      if(game.introStage===0){
        game.introStage=1;
        game.introBubble="Phew... I'm so thirsty!";
        game.introBubbleAlpha=1;
        setTimeout(()=>{
          if(game.state===State.WALKING){
            game.introStage=2;
            game.introBubble='';
            game.introBubbleAlpha=0;
            game.state=State.THIRSTY;
            game.tongueOut=true;
            game.canDrink=true;
            game.showPrompt=true;
            game.promptAlpha=0;
          }
        },2500);
      }
    }
  }

  // Prompt fade in
  if(game.showPrompt&&game.promptAlpha<1){
    game.promptAlpha=Math.min(1,game.promptAlpha+0.02);
  }

  // Sweat drops
  if(game.state===State.WALKING||game.tongueOut||game.drinkCount>10){
    if(game.state===State.WALKING ? Math.random()<0.03 : Math.random()<0.05){
      const bellyR=game.baseRadius+game.fillLevel*400;
      game.sweatDrops.push({
        x:(Math.random()-0.5)*50,
        y:-bellyR*1.2-Math.random()*30,
        w:4+Math.random()*4,
        h:6+Math.random()*4
      });
    }
    for(let i=game.sweatDrops.length-1;i>=0;i--){
      game.sweatDrops[i].y-=0.5;
      game.sweatDrops[i].x+=Math.sin(game.gameTime*0.05+i)*0.3;
      if(game.sweatDrops[i].y<-100) game.sweatDrops.splice(i,1);
    }
  }

  // Continuous throat bob while feeding
  if(game.feeding){
    game.headTilt=-0.1+Math.sin(game.gameTime*0.2)*0.05;
  }

  // Belly scale elastic animation (bypassed during burst for instant snap)
  if(game.state!==State.BURST){
    game.bellyScale+=(game.targetBellyScale-game.bellyScale)*0.12;
    if(game.bellyScale>1.01) game.targetBellyScale=1;
  }

  // Pre-burst trembling when fillLevel is critical
  if(game.fillLevel>0.85&&game.state===State.THIRSTY){
    game.shakeAmount=4+Math.sin(game.gameTime*0.12)*3;
    game.bellyScale=1+Math.sin(game.gameTime*0.15)*0.04;
  }

  // Head tilt recovery
  if(game.headTilt<0) game.headTilt+=0.01;
  if(game.headTilt>0) game.headTilt=0;

  // Bottle recovery (only when not feeding)
  if(!game.feeding&&Math.abs(game.bottleAngle)>0.01) game.bottleAngle*=0.9;
  else if(!game.feeding) game.bottleAngle=0;
  if(game.bottleSquash<1) game.bottleSquash+=(1-game.bottleSquash)*0.12;

  // Bottle shake
  if(game.bottleShake>0) game.bottleShake*=0.9;
  if(game.bottleShake<0.1) game.bottleShake=0;

  // Stream animation (feedTick manages progress when feeding)
  if(game.isStreaming&&!game.feeding){
    game.streamProgress+=0.04;
    if(game.streamProgress>=1){
      game.isStreaming=false;
      game.streamProgress=0;
    }
  }

  // Burp timer
  if(game.burpTimer>0) game.burpTimer--;

  // Bottle vibrates while feeding
  if(game.feeding) game.bottleShake=Math.max(game.bottleShake,2+Math.sin(game.gameTime*0.1)*1.5);

  // Warning state
  if(game.state===State.WARNING){
    game.shakeAmount=8+Math.sin(game.gameTime*0.05)*4;
    if(game.stopBubble.scale<1) game.stopBubble.scale=Math.min(1,game.stopBubble.scale+0.05);
    game.stopBubble.shakeX=(Math.random()-0.5)*6;
    game.stopBubble.shakeY=(Math.random()-0.5)*6;
    game.bottleShake=5+Math.random()*5;
  }

  // Burst state
  if(game.state===State.BURST){
    game.burstTimer++;
    const t=game.burstTimer;
    // Frame 0-3: freeze-frame anticipation (intense shake, no collapse yet)
    if(t<4){
      game.shakeAmount=30;
      game.bearBodyAngle=0;
      game.bellyScale=4.5+Math.sin(t*2)*0.3;
    }else{
      // Screen shake: violent then fade
      game.shakeAmount=t<15?28:Math.max(0,22-t*0.3);
      // BOOM text: punch out fast
      if(game.boomText.show){
        if(t<16){
          game.boomText.scale=0.01+(t-4)/12*1.5;
        }else if(t<22){
          game.boomText.scale=1.5-(t-16)/6*0.25;
        }else if(t<30){
          game.boomText.scale=1.25+(t-22)/8*0.1;
        }else{
          game.boomText.scale=1.35;
        }
        if(t>250) game.boomText.alpha=Math.max(0,1-(t-250)/40);
      }
      // Bear collapses fast after anticipation
      if(t>6){
        game.bearBodyAngle+=0.08;
        if(game.bearBodyAngle>Math.PI*0.5){
          game.bearBodyAngle=Math.PI*0.5;
          game.bearRagdollY=6;
        }
      }
    }
    // More particles burst at frames 4, 10
    if(t===4) spawnBurstParticles();
    if(t===10) spawnBurstParticles();
    if(t>290) endGame();
    updateParticles();
  }

  // Game over
  if(game.state===State.GAME_OVER){
    updateParticles();
  }

  // Plus ones
  updatePlusOnes();

  // Warning beep every ~1s
  if(game.state===State.WARNING&&game.gameTime%60===0){
    Sound.warning();
  }

  // Pet timer
  if(game.petTimer>0) game.petTimer--;
  // Sun wobble timer
  if(game.sunWobble>0) game.sunWobble--;

  // Pop particles
  updatePopParticles();
  updateConfetti();
}

// ===================== RENDER ========================================
function render(){
  ctx.clearRect(0,0,W,H);

  // Screen shake
  ctx.save();
  if(game.shakeAmount>0.5){
    const sx=(Math.random()-0.5)*game.shakeAmount;
    const sy=(Math.random()-0.5)*game.shakeAmount;
    ctx.translate(sx,sy);
  }

  drawBackground();
  drawBuildings();
  drawFlyingObjects();
  drawDog();
  drawStopBubble();
  drawParticles();
  drawBear();
  drawBoomText();
  drawConfetti();
  drawStream();
  drawBottle();
  drawPlusOnes();
  drawIntroBubble();
  drawPopParticles();
  drawPrompt();

  // HUD
  const hudY=H*0.025;
  // Mute button (top-right, always visible)
  const muteX=W*0.97,muteY=H*0.025,muteR=H*0.02;
  ctx.fillStyle=muted?'rgba(200,50,50,0.5)':'rgba(255,255,255,0.2)';
  ctx.beginPath();ctx.arc(muteX,muteY,muteR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=muted?'#FFF':'#333';
  ctx.font=`${muteR*1.2}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(muted?'🔇':'🔊',muteX,muteY+1);

  // HUD panel: score, best, drink fill
  if(game.state!==State.START){
    const sw=Math.min(W*0.17,140);
    const hs=localStorage.getItem('bearFeedHighScore');
    const showFill=game.canDrink&&game.state!==State.BURST&&game.state!==State.GAME_OVER;
    const rows=showFill?3:2;
    const ph=H*(0.018+rows*0.028);
    ctx.fillStyle='rgba(0,0,0,0.5)';
    roundRect(ctx,W*0.015,H*0.015,sw,ph,H*0.015);
    ctx.fill();
    ctx.fillStyle='#FFD600';ctx.font=`bold ${H*0.02}px sans-serif`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(`⭐ ${game.popScore}`,W*0.03,H*0.035);
    ctx.fillStyle='#FFA726';ctx.font=`bold ${H*0.016}px sans-serif`;
    ctx.fillText(`🏆 ${hs||'0'}`,W*0.03,H*0.065);
    if(showFill){
      const pct=Math.round(game.fillLevel*100);
      ctx.fillStyle='#81D4FA';ctx.font=`bold ${H*0.018}px sans-serif`;
      ctx.fillText(`🧃 ${pct}%`,W*0.03,H*0.095);
    }
  }

  // White flash overlay during early burst (after anticipation)
  if(game.state===State.BURST&&game.burstTimer>=4&&game.burstTimer<18){
    ctx.fillStyle=`rgba(255,255,255,${0.5*(1-(game.burstTimer-4)/14)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Red pulsing overlay at critical fill (90%+)
  if(game.fillLevel>0.9&&game.state===State.THIRSTY){
    const pulse=0.08+Math.sin(game.gameTime*0.06)*0.05;
    ctx.fillStyle=`rgba(255,0,0,${pulse})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore(); // screen shake
}

// ===================== GAME LOOP =====================================
function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ===================== INTERACTIONS ==================================
function getClickPos(e){
  const rect=canvas.getBoundingClientRect();
  let x,y;
  if(e.touches){
    x=e.touches[0].clientX-rect.left;
    y=e.touches[0].clientY-rect.top;
  }else{
    x=e.clientX-rect.left;
    y=e.clientY-rect.top;
  }
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  return {x:x*scaleX,y:y*scaleY};
}

function isBottleHit(px,py){
  const bx=bottleCenterX(),by=bottleCenterY();
  const bw=Math.min(W,H)*0.07,bh=Math.min(W,H)*0.17;
  return px>=bx-bw&&px<=bx+bw&&py>=by-bh&&py<=by+bh;
}

function isDogHit(px,py){
  const dx=dogCenterX(),dy=dogCenterY();
  const r=Math.min(W,H)*0.06;
  return Math.abs(px-dx)<r&&Math.abs(py-dy)<r;
}
function isSunHit(px,py){
  const sx=W*0.85,sy=H*0.1,sr=Math.min(W,H)*0.12;
  return Math.abs(px-sx)<sr&&Math.abs(py-sy)<sr;
}

function startFeed(e){
  e.preventDefault();
  const pos=getClickPos(e);
  // Mute toggle?
  const muteX=W*0.97,muteY=H*0.025,muteR=H*0.02;
  if(Math.abs(pos.x-muteX)<muteR*1.5&&Math.abs(pos.y-muteY)<muteR*1.5){
    muted=!muted;
    return;
  }
  // Pet the puppy?
  if(isDogHit(pos.x,pos.y)&&game.state!==State.BURST&&game.state!==State.GAME_OVER){
    game.petTimer=40;
    spawnHeart();
    Sound.bark();
    return;
  }
  // Giggle the sun?
  if(isSunHit(pos.x,pos.y)){
    game.sunWobble=30;
    Sound.giggle();
    return;
  }
  // Check flying objects first (always interactive)
  if(hitFlyingObject(pos.x,pos.y)) return;
  // Then check bottle for feeding
  if(game.canDrink&&isBottleHit(pos.x,pos.y)&&game.state!==State.BURST&&game.state!==State.GAME_OVER){
    game.feeding=true;
    game.bottleSquash=0.75;
  }
}
function stopFeed(e){
  if(game.feeding){
    game.feeding=false;
    game.isStreaming=false;
    game.bottleSquash=1;
  }
}
canvas.addEventListener('touchstart',startFeed,{passive:false});
canvas.addEventListener('touchend',stopFeed);
canvas.addEventListener('touchcancel',stopFeed);
canvas.addEventListener('mousedown',startFeed);
canvas.addEventListener('mouseup',stopFeed);
canvas.addEventListener('mouseleave',stopFeed);

document.getElementById('playBtn').addEventListener('click',()=>{
  try{getAudioCtx()}catch(e){}
  startGame();
});

document.getElementById('restartBtn').addEventListener('click',()=>{
  startGame();
});

// ===================== HIGH SCORE ====================================
function updateHighScoreDisplay(){
  const hs=localStorage.getItem('bearFeedHighScore');
  const el=document.getElementById('highScoreDisplay');
  if(el) el.textContent=`🏆 Best: ${hs||'0'}`;
}
function saveHighScore(score){
  const prev=parseInt(localStorage.getItem('bearFeedHighScore')||'0');
  if(score>prev) localStorage.setItem('bearFeedHighScore',score.toString());
  updateHighScoreDisplay();
}

// ===================== BOOT ==========================================
// Proper resize handler that updates character positions
function onResize(){
  resize();
  initBuildings();
  initFlyingObjects();
  if(typeof game !== 'undefined' && game.state!==State.START&&game.state!==State.WALKING){
    game.bearY=bearCenterY();
    game.targetX=bearCenterX();
    if(game.bearX>0) game.bearX=bearCenterX();
  }
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,300));
onResize();

// Initialize bear Y
game.bearY=bearCenterY();
game.targetX=bearCenterX();

initBuildings();
initFlyingObjects();
updateHighScoreDisplay();
gameLoop();
</script>
</body>
</html>
